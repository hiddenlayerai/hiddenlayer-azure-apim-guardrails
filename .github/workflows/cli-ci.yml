name: CLI CI

on:
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/cli-ci.yml"
      - ".github/workflows/cli-release.yml"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/cli-ci.yml"
      - ".github/workflows/cli-release.yml"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Run tests
        run: go test ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build CLI
        run: make build
